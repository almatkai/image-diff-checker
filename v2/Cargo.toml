[package]
name = "image-diff-checker-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND ISC AND Apache-2.0 AND BSD-3-Clause"

[[bin]]
name = "image-diff-checker"
path = "src/main.rs"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }
base64 = "=0.22.1"
png = "=0.17.16"
gif = "=0.13.3"
libc = "=0.2.186"

[dev-dependencies]
tempfile = "=3.27.0"
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
walkdir = "=2.5.0"
semver = "=1.0.27"
zopfli = "=0.8.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
